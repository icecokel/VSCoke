# 운영 Mac mini의 API 스택. 배포 workflow가 $API_DEPLOY_DIR/docker-compose.yml로 복사한다.
# 같은 디렉터리의 세 파일은 scripts/api-deploy-env.mjs write가 운영 Secret에서 생성한다.
# - api.env: 운영 secret 전체. API 컨테이너에 /app/.env로 읽기 전용 mount되고 컨테이너 안의 같은 스크립트가 파싱한다.
# - postgres.env: postgres 초기화용 DB_* 값(raw 형식).
# - .env: compose가 보간하는 PORT. secret은 compose 보간을 거치지 않는다.
name: vscoke-api

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - path: postgres.env
        format: raw
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: vscoke-api:latest
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      # cloudflared(호스트 loopback) -> docker 게이트웨이(uniquelocal) 경로의 X-Forwarded-For를 신뢰한다.
      TRUST_PROXY: loopback, uniquelocal
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./api.env:/app/.env:ro
      - ./logs:/app/logs
      - embedding-cache:/app/.cache/embeddings
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Codex app-server는 호스트 loopback에서 실행된다: RAG_CODEX_APP_SERVER_URL=ws://host.docker.internal:14561
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  embedding-cache:
