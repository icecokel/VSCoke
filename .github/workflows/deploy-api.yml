name: Deploy API to OCI (native)

on:
  workflow_dispatch:
    inputs:
      verify_public:
        description: "터널 전환 후 공개 API도 검사"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "apps/web/src/constants/resume-data.json"
      - "apps/web/messages/*.json"
      - "apps/web/resume-detail/**"
      - "docs/public-site-guide.md"
      - "docs/public-resume-experience.md"
      - "docs/public-resume-raw-data.md"
      - "scripts/check-api-health.mjs"
      - "scripts/api-health-checker.mjs"
      - "scripts/api-deploy-env.mjs"
      - "scripts/api-deploy-scope.mjs"
      - "scripts/package-api-native.sh"
      - "scripts/deploy-api-native.sh"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-api-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, vscoke-api, oci-01]
    timeout-minutes: 45
    env:
      API_DEPLOY_DIR: ${{ vars.API_DEPLOY_DIR || '/home/ubuntu/vscoke-api' }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.icecoke.kr/health' }}
      API_LOCAL_HEALTH_URL: ${{ vars.API_LOCAL_HEALTH_URL || 'http://127.0.0.1:3000/health' }}
      API_VERIFY_PUBLIC: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public || github.event_name == 'push' && vars.API_VERIFY_PUBLIC == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Decide API deployment
        id: scope
        env:
          API_DEPLOY_BEFORE: ${{ github.event.before }}
        run: node scripts/api-deploy-scope.mjs

      - name: Validate production environment secret
        if: steps.scope.outputs.should_deploy == 'true'
        env:
          API_ENV_PRODUCTION: ${{ secrets.API_ENV_PRODUCTION }}
        run: node scripts/api-deploy-env.mjs check

      - name: Verify self-hosted runner prerequisites
        if: steps.scope.outputs.should_deploy == 'true'
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test -f "$API_DEPLOY_DIR/.local/activate"
          test -f "$API_DEPLOY_DIR/.local/db.env"
          test -x "$API_DEPLOY_DIR/current/bin/node"
          systemctl is-active --quiet postgresql@16-main.service
          sudo -n -l /usr/bin/systemctl restart vscoke-api.service

      - name: Setup pnpm
        if: steps.scope.outputs.should_deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        if: steps.scope.outputs.should_deploy == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate API and deployment
        if: steps.scope.outputs.should_deploy == 'true'
        run: |
          pnpm --filter @vscoke/api lint
          pnpm --filter @vscoke/api exec jest --runInBand
          pnpm test:tooling
          node --test scripts/api-health-checker.test.mjs

      - name: Invalidate API deployment baseline
        if: steps.scope.outputs.should_deploy == 'true'
        run: |
          # 실패·취소 후에는 UI 변경이나 원복도 다시 배포해야 한다.
          rm -f "$API_DEPLOY_DIR/.last-successful-deploy"

      - name: Build API native release
        if: steps.scope.outputs.should_deploy == 'true'
        run: |
          pnpm build:api
          bash scripts/package-api-native.sh "$RUNNER_TEMP/vscoke-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Deploy API native release
        if: steps.scope.outputs.should_deploy == 'true'
        env:
          API_ENV_PRODUCTION: ${{ secrets.API_ENV_PRODUCTION }}
        run: bash scripts/deploy-api-native.sh "$RUNNER_TEMP/vscoke-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Record successful API deployment
        if: steps.scope.outputs.should_deploy == 'true'
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$API_DEPLOY_DIR/.last-successful-deploy"
