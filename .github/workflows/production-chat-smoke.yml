name: Production Chat Smoke

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "smoke를 실행하지 않고 실패 처리해 Discord 알림만 확인"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-chat-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: https://vscoke.icecoke.kr
      PLAYWRIGHT_PRODUCTION_SMOKE: "1"
      PLAYWRIGHT_RETRIES: "1"
    steps:
      - name: Fail on purpose for alert check
        if: inputs.force_failure
        run: |
          echo "::error::force_failure 입력으로 알림 확인용 실패를 발생시킵니다."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vscoke/web exec playwright install --with-deps chromium
      - run: >-
          pnpm --filter @vscoke/web e2e
          tests/e2e/main-chat-production-smoke.spec.ts
          tests/e2e/resume-rag-chat-production-smoke.spec.ts
          tests/e2e/resume-conversation-production-smoke.spec.ts
          --project=chromium

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-chat-smoke-${{ github.run_id }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7

  notify-failure:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout alert script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/discord-failure-alert.mjs
          sparse-checkout-cone-mode: false

      - name: Send Discord failure alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_NOTE: ${{ inputs.force_failure && '알림 확인용 강제 실패(force_failure)' || '' }}
        run: node scripts/discord-failure-alert.mjs
